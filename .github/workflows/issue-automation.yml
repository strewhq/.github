# Reusable workflow, called from each strewhq repo's .github/workflows/automation.yml.
# - PR opened from branch `14-some-title`: appends "Closes #14" to the PR body.
# - PR merged into ANY branch (e.g. development): closes linked issues as completed.
name: Issue automation

on:
  workflow_call:

permissions: {}

jobs:
  link-issue:
    name: Link issue from branch name
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$BRANCH" =~ ^([0-9]+)- ]] || exit 0
          n="${BASH_REMATCH[1]}"
          body="$(gh pr view "$PR" --json body --jq '.body // ""')"
          grep -Eiq "(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#${n}\b" <<<"$body" && exit 0
          printf '%s\n\nCloses #%s\n' "$body" "$n" | gh pr edit "$PR" --body-file -

  close-issues:
    name: Close linked issues on merge
    if: github.event.action == 'closed' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          body="$(gh pr view "$PR" --json body --jq '.body // ""')"
          issues="$( { [[ "$BRANCH" =~ ^([0-9]+)- ]] && echo "${BASH_REMATCH[1]}"
                       grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<<"$body" | grep -Eo '[0-9]+' || true; } | sort -un )"
          sleep 5 # let GitHub's own keyword-close (default branch) land first
          for n in $issues; do
            [ "$(gh issue view "$n" --json state --jq .state 2>/dev/null)" = OPEN ] || continue
            gh issue close "$n" --reason completed --comment "Closed by #$PR (merged into \`$BASE\`)."
          done
