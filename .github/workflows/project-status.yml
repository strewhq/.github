# Reusable workflow: keeps the "Strew Development" project in sync with pull requests.
#
# Called from .github/workflows/project-status.yml in each strewhq repo.
#   PR opened / reopened / ready for review (not draft) -> linked issues: Status = "In Review"
#   PR merged                                           -> linked issues: Status = "Done", issue closed as completed
#   PR closed without merge                             -> linked issues still "In Review" go back to "In Progress"; issue stays open
# Linked issues come from:
#   1. the PR's linked issues (closing keywords like "Closes #12", or "Development" links in the sidebar)
#   2. closing keywords in the PR body, including cross-repo ones (strewhq/mcp#12)
#   3. the branch name: 12-some-title, feat/12-some-title, issue-12-some-title, 12_some_title (same repo as the PR)
# Issues not yet in the project are added to it.
# Needs secret PROJECT_TOKEN: classic PAT with `repo` + `project`, or fine-grained PAT on the strewhq org with
# Issues: read/write, Pull requests: read, Metadata: read, and organization Projects: read/write.
name: Project status

on:
  workflow_call:
    inputs:
      project-owner:
        type: string
        default: strewhq
      project-number:
        type: number
        default: 1
      status-field:
        type: string
        default: Status
      review-status:
        type: string
        default: In Review
      done-status:
        type: string
        default: Done
      abandoned-status:
        description: Status for issues whose PR is closed without merge (only if they are still in review-status). Empty = leave as is.
        type: string
        default: In Progress
    secrets:
      PROJECT_TOKEN:
        required: false

permissions: {}

jobs:
  sync:
    name: Sync project status
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: project-status-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Update linked issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ACTION: ${{ github.event.action }}
          REPO_FULL: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PROJECT_OWNER: ${{ inputs.project-owner }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          STATUS_FIELD: ${{ inputs.status-field }}
          REVIEW_STATUS: ${{ inputs.review-status }}
          DONE_STATUS: ${{ inputs.done-status }}
          ABANDONED_STATUS: ${{ inputs.abandoned-status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret PROJECT_TOKEN is not available (missing org/repo secret, or PR from a fork). Project not updated."
            exit 1
          fi

          # Retry transient API failures.
          gql() { local i; for i in 1 2 3 4; do if out=$(gh api graphql "$@" 2>&1); then printf '%s' "$out"; return 0; fi; echo "graphql attempt $i failed: $out" >&2; sleep $((i*3)); done; return 1; }

          case "$ACTION" in
            opened|reopened|ready_for_review)
              if [ "$DRAFT" = "true" ]; then echo "Draft PR: nothing to do until it is ready for review."; exit 0; fi
              MODE=review ;;
            closed)
              if [ "$MERGED" = "true" ]; then MODE=done; else MODE=abandoned; fi ;;
            *) echo "Ignoring action $ACTION"; exit 0 ;;
          esac
          if [ "$MODE" = abandoned ] && [ -z "$ABANDONED_STATUS" ]; then echo "PR closed without merge: leaving issues as they are."; exit 0; fi
          echo "Mode: $MODE (PR $REPO_FULL#$PR, base $BASE)"

          OWNER="${REPO_FULL%/*}"; REPO="${REPO_FULL#*/}"

          # Project, Status field and option ids (resolved by name, so nothing breaks if ids change).
          proj=$(gql -f query='query($o:String!,$n:Int!,$f:String!){organization(login:$o){projectV2(number:$n){id field(name:$f){... on ProjectV2SingleSelectField{id options{id name}}}}}}' \
                 -f o="$PROJECT_OWNER" -F n="$PROJECT_NUMBER" -f f="$STATUS_FIELD")
          PROJECT_ID=$(jq -r '.data.organization.projectV2.id // empty' <<<"$proj")
          FIELD_ID=$(jq -r '.data.organization.projectV2.field.id // empty' <<<"$proj")
          [ -n "$PROJECT_ID" ] && [ -n "$FIELD_ID" ] || { echo "::error::Project $PROJECT_OWNER/$PROJECT_NUMBER or field '$STATUS_FIELD' not found: $proj"; exit 1; }
          opt() { jq -r --arg n "$1" '.data.organization.projectV2.field.options[] | select(.name==$n) | .id' <<<"$proj"; }
          case "$MODE" in
            review) TARGET="$REVIEW_STATUS" ;;
            done) TARGET="$DONE_STATUS" ;;
            abandoned) TARGET="$ABANDONED_STATUS" ;;
          esac
          OPTION_ID=$(opt "$TARGET")
          [ -n "$OPTION_ID" ] || { echo "::error::Status option '$TARGET' does not exist in field '$STATUS_FIELD'"; exit 1; }

          # Linked issues.
          prq=$(gql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){headRefName body closingIssuesReferences(first:25){nodes{id number repository{nameWithOwner}}}}}}' \
                -f o="$OWNER" -f r="$REPO" -F n="$PR")
          BRANCH=$(jq -r '.data.repository.pullRequest.headRefName' <<<"$prq")
          BODY=$(jq -r '.data.repository.pullRequest.body // ""' <<<"$prq")
          refs=$(jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "\(.repository.nameWithOwner)#\(.number)"' <<<"$prq")

          # Branch name: last path segment, optional "issue-"/"gh-" prefix, then the number.
          seg="${BRANCH##*/}"
          if [[ "$seg" =~ ^(issue-|issues-|gh-)?([0-9]+)([-_].*)?$ ]]; then refs+=$'\n'"$REPO_FULL#${BASH_REMATCH[2]}"; fi

          # Closing keywords in the body (covers PRs into non-default branches like dev, which GitHub does not link).
          kw=$(grep -Eio '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]:]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' <<<"$BODY" | grep -Eo '([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+$' || true)
          while read -r k; do
            [ -z "$k" ] && continue
            if [[ "$k" == \#* ]]; then refs+=$'\n'"$REPO_FULL$k"; else refs+=$'\n'"$k"; fi
          done <<<"$kw"

          refs=$(grep -E '^[^#]+/[^#]+#[0-9]+$' <<<"$refs" | sort -u || true)
          if [ -z "$refs" ]; then
            echo "::notice::No linked issue found (branch '$BRANCH'). Name the branch '<issue>-slug' or add 'Closes #<issue>' to the PR."
            exit 0
          fi
          echo "Linked: $(tr '\n' ' ' <<<"$refs")"

          rc=0
          while read -r ref; do
            r="${ref%#*}"; n="${ref##*#}"
            iq=$(gql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issueOrPullRequest(number:$n){__typename ... on Issue{id state projectItems(first:50){nodes{id project{id} fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}}}}' \
                 -f o="${r%/*}" -f r="${r#*/}" -F n="$n") || { echo "::warning::$ref: lookup failed"; rc=1; continue; }
            [ "$(jq -r '.data.repository.issueOrPullRequest.__typename // empty' <<<"$iq")" = Issue ] || { echo "$ref is not an issue, skipped"; continue; }
            ISSUE_ID=$(jq -r '.data.repository.issueOrPullRequest.id' <<<"$iq")
            STATE=$(jq -r '.data.repository.issueOrPullRequest.state' <<<"$iq")
            ITEM_ID=$(jq -r --arg p "$PROJECT_ID" '.data.repository.issueOrPullRequest.projectItems.nodes[] | select(.project.id==$p) | .id' <<<"$iq" | head -n1)
            CURRENT=$(jq -r --arg p "$PROJECT_ID" '.data.repository.issueOrPullRequest.projectItems.nodes[] | select(.project.id==$p) | .fieldValueByName.name // ""' <<<"$iq" | head -n1)

            if [ "$MODE" != done ] && [ "$STATE" != OPEN ]; then echo "$ref is closed, left unchanged"; continue; fi
            if [ "$MODE" = abandoned ] && [ "$CURRENT" != "$REVIEW_STATUS" ]; then echo "$ref is '$CURRENT', left unchanged"; continue; fi

            if [ -z "$ITEM_ID" ]; then
              ITEM_ID=$(gql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' -f p="$PROJECT_ID" -f c="$ISSUE_ID" | jq -r '.data.addProjectV2ItemById.item.id // empty')
              [ -n "$ITEM_ID" ] || { echo "::warning::$ref: could not add to project"; rc=1; continue; }
              echo "$ref added to project"
            fi

            if gql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
                 -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$FIELD_ID" -f o="$OPTION_ID" >/dev/null; then
              echo "$ref: Status '$CURRENT' -> '$TARGET'"
            else echo "::warning::$ref: status update failed"; rc=1; fi

            if [ "$MODE" = done ] && [ "$STATE" = OPEN ]; then
              # GitHub only auto-closes for merges into the default branch, so close it here (any base branch).
              # Single attempt (not retried) so a flaky network cannot post the comment twice.
              gh api graphql -f query='mutation($i:ID!,$b:String!){addComment(input:{subjectId:$i,body:$b}){clientMutationId}}' -f i="$ISSUE_ID" -f b="Closed by $PR_URL (merged into \`$BASE\`)." >/dev/null 2>&1 || true
              if gql -f query='mutation($i:ID!){closeIssue(input:{issueId:$i,stateReason:COMPLETED}){issue{state}}}' -f i="$ISSUE_ID" >/dev/null; then
                echo "$ref closed as completed"
              else echo "::warning::$ref: close failed"; rc=1; fi
            fi
          done <<<"$refs"
          exit $rc
